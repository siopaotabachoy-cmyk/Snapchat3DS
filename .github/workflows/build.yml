name: Build Snap3DS

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: make

      - name: Upload .3dsx
        uses: actions/upload-artifact@v7
        with:
          name: Snap3DS
          path: Snap3DS.3dsx
          if-no-files-found: error
