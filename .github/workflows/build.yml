name: Build Snap3DS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: make

      - name: Upload .3dsx
        uses: actions/upload-artifact@v7
        with:
          name: Snap3DS
          path: Snap3DS.3dsx
          if-no-files-found: error

  qr:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: Snap3DS

      - name: Make QR code
        run: |
          sudo apt-get update
          sudo apt-get install -y qrencode
          URL="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/Snap3DS.3dsx"
          qrencode -s 8 -m 4 -o qr.png "$URL"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-$GITHUB_RUN_NUMBER"
          IMG="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/qr.png"
          printf 'Scan with FBI: Remote Install, then Scan QR Code\n\n![QR](%s)\n' "$IMG" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Snap3DS.3dsx qr.png --clobber
          else
            gh release create "$TAG" Snap3DS.3dsx qr.png --target "$GITHUB_SHA" \
              --title "Snap3DS build $GITHUB_RUN_NUMBER" --notes-file notes.md --latest
          fi

      - name: Show QR code in README
        run: |
          IMG="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/qr.png"
          if ! grep -qF "$IMG" README.md 2>/dev/null; then
            printf '\n## Install with QR code\nIn FBI: Remote Install, then Scan QR Code.\n\n![QR code](%s)\n' "$IMG" >> README.md
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Add install QR code to README"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
